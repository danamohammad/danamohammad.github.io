name: Fetch research

on:
  schedule:
    # Every 12 hours, offset off the hour to avoid the top-of-hour runner crush.
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch from ORCID, Crossref and Zenodo
        run: node scripts/fetch-research.mjs

      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- src/data/research.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to research.json."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/research.json
          git commit -m "data: refresh research from ORCID/Crossref/Zenodo"

          # Both data workflows can be in flight at once, and Dana may push by
          # hand at any time. Rebase onto whatever landed first and retry rather
          # than failing the run on a rejected push.
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase origin main
          done

          echo "Could not push after 3 attempts." >&2
          exit 1

  # Commits made with GITHUB_TOKEN do not fire `on: push`, so the deploy is
  # invoked explicitly. Without this the site would fetch new data forever and
  # never rebuild.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
