name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable by the data workflows. This is what defuses the GITHUB_TOKEN trap:
  # a commit pushed with the default token does NOT trigger `on: push`, so the
  # fetch workflows invoke this one directly instead of hoping a push fires it.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a data commit that
# lands mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx astro build

      - name: Fail if a secret reached the built output
        run: node scripts/check-no-secrets.mjs

      # Internal links only. Probing 180 outbound links on every deploy would be
      # slow and would make the build hostage to other people's uptime; run
      # `npm run check:links -- --external` by hand for that.
      - name: Check internal links
        run: node scripts/check-links.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
